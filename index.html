<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WSTI — Work Style Type Indicator</title>
<meta name="description" content="Eight questions. Sixteen work styles. Find your four-letter type and who you work best with.">

<meta property="og:type" content="website">
<meta property="og:title" content="WSTI — Work Style Type Indicator">
<meta property="og:description" content="Eight questions. Sixteen work styles. Find your four-letter type and who you work best with.">
<meta property="og:image" content="https://koron016.github.io/HP/assets/ogp/top-en.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
</head>
<body>

<nav class="langbar">
  <button type="button" class="lang" data-lang="en">EN</button>
  <button type="button" class="lang" data-lang="ja">日本語</button>
</nav>

<main class="app">

  <!-- ============ スタート画面 / Start ============ -->
  <section id="screen-start" class="screen">
    <p class="eyebrow" data-ui="eyebrow"></p>
    <h1 class="title"><span class="title-accent" id="brand"></span></h1>
    <p class="lead" id="tagline"></p>
    <button id="btn-start" class="btn btn-main" type="button"></button>
    <p class="note" data-ui="startNote"></p>
  </section>

  <!-- ============ 質問画面 / Questions ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="progress">
      <div class="progress-meta">
        <span id="q-counter"></span>
        <button id="btn-back" class="btn-back" type="button"></button>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </div>

    <h2 id="q-text" class="question"></h2>
    <div id="q-choices" class="choices"></div>
  </section>

  <!-- ============ 結果画面 / Result ============ -->
  <section id="screen-result" class="screen" hidden>
    <p class="eyebrow" data-ui="resultLabel"></p>

    <p id="result-code" class="result-code"></p>
    <h2 id="result-name" class="result-name"></h2>
    <p id="result-catch" class="result-catch"></p>

    <div id="result-axes" class="axes"></div>

    <p id="result-body" class="result-body"></p>
    <p id="result-twist" class="result-twist"></p>

    <div class="panel">
      <p class="panel-label" id="label-strengths"></p>
      <ul id="result-strengths" class="bullets"></ul>
    </div>

    <div class="panel">
      <p class="panel-label" id="label-watch"></p>
      <ul id="result-watch" class="bullets is-warn"></ul>
    </div>

    <div class="panel">
      <p class="panel-label" id="label-fits"></p>
      <p id="result-fits" class="panel-body"></p>
    </div>

    <div class="panel is-pitch">
      <p class="panel-label" id="label-pitch"></p>
      <p id="result-pitch" class="pitch-text"></p>
      <p class="panel-note" data-ui="pitchNote"></p>
    </div>

    <div class="matches">
      <div class="match">
        <p class="match-label" id="label-good"></p>
        <p id="match-good" class="match-type"></p>
      </div>
      <div class="match">
        <p class="match-label" id="label-bad"></p>
        <p id="match-bad" class="match-type"></p>
      </div>
    </div>

    <div class="actions">
      <a id="btn-share" class="btn btn-main" href="#" target="_blank" rel="noopener"></a>
      <button id="btn-copy" class="btn btn-sub" type="button"></button>
      <button id="btn-retry" class="btn btn-ghost" type="button"></button>
    </div>

    <p class="note" data-ui="resultNote"></p>
  </section>

  <noscript>
    <p class="noscript">
      This test needs JavaScript. Enable it in your browser settings and reload.<br>
      この診断はJavaScriptを使って動きます。有効にしてから読み込み直してください。
    </p>
  </noscript>

</main>

<footer class="foot">
  <p>© <span id="year">2026</span> <span id="foot-brand"></span></p>
</footer>

<script src="assets/quiz-data.js"></script>
<script src="assets/quiz.js"></script>
</body>
</html>
