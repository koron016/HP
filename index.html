<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI依存度診断 — あなたはもう、どこまでAIに預けている？</title>
<meta name="description" content="6つの質問に答えるだけ。あなたがどこまでAIに脳を預けているか、30秒でわかります。">

<meta property="og:type" content="website">
<meta property="og:title" content="AI依存度診断">
<meta property="og:description" content="6つの質問に答えるだけ。あなたがどこまでAIに脳を預けているか、30秒でわかります。">
<meta property="og:image" content="https://koron016.github.io/HP/assets/ogp/top.png">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
</head>
<body>

<main class="app">

  <!-- ============ スタート画面 ============ -->
  <section id="screen-start" class="screen">
    <p class="eyebrow">6つの質問・30秒</p>
    <h1 class="title">
      AI依存度<span class="title-accent">診断</span>
    </h1>
    <p class="lead">
      気づけば、なんでも聞いていませんか。<br>
      あなたがどこまでAIに預けているか、測ります。
    </p>
    <button id="btn-start" class="btn btn-main" type="button">診断をはじめる</button>
    <p class="note">結果はその場で表示されます。登録も入力もありません。</p>
  </section>

  <!-- ============ 質問画面 ============ -->
  <section id="screen-quiz" class="screen" hidden>
    <div class="progress">
      <div class="progress-meta">
        <span id="q-counter">Q1 / 6</span>
        <button id="btn-back" class="btn-back" type="button">戻る</button>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </div>

    <h2 id="q-text" class="question"></h2>
    <div id="q-choices" class="choices"></div>
  </section>

  <!-- ============ 結果画面 ============ -->
  <section id="screen-result" class="screen" hidden>
    <p class="eyebrow">あなたのAI依存度は</p>

    <div class="score">
      <span id="score-num" class="score-num">0</span><span class="score-unit">%</span>
    </div>
    <div class="meter"><div id="meter-fill" class="meter-fill"></div></div>

    <h2 id="result-name" class="result-name"></h2>
    <p id="result-catch" class="result-catch"></p>
    <p id="result-body" class="result-body"></p>
    <p id="result-twist" class="result-twist"></p>

    <div class="actions">
      <a id="btn-share" class="btn btn-main" href="#" target="_blank" rel="noopener">結果をXでシェア</a>
      <button id="btn-copy" class="btn btn-sub" type="button">リンクをコピー</button>
      <button id="btn-retry" class="btn btn-ghost" type="button">もう一度やる</button>
    </div>

    <p class="note">同じ質問を友達にも。何％だったか聞いてみてください。</p>
  </section>

  <noscript>
    <p class="noscript">
      この診断はJavaScriptを使って動きます。ブラウザの設定でJavaScriptを有効にしてから、
      ページを読み込み直してください。
    </p>
  </noscript>

</main>

<footer class="foot">
  <p>© <span id="year">2026</span> AI依存度診断</p>
</footer>

<script src="assets/quiz-data.js"></script>
<script src="assets/quiz.js"></script>
</body>
</html>
