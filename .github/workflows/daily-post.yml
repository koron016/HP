name: 今日のX投稿文をIssueにする

# 毎朝7時（日本時間）に、その日の投稿文をIssueとして立てます。
# スマホのGitHubアプリに通知が来るので、コピーしてXに貼るだけです。
#
# 注意が2つあります。
#  1. Actions はデフォルトブランチにあるワークフローしか動かしません。
#     定時実行も手動の Run workflow も同じです。
#     リポジトリの Settings → General → Default branch を
#     claude/claude-md-docs-3bgn2h に切り替えてください。
#  2. 60日間リポジトリに動きがないと、GitHubがスケジュールを止めます。
#     止まったら Actions のページから「Enable workflow」で戻せます。

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = 翌朝7:00 JST
  workflow_dispatch:       # 手で今すぐ出したいとき用
    inputs:
      day:
        description: "何日目のネタを出すか（空なら今日）"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/claude-md-docs-3bgn2h

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 投稿文を組み立てる
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            node tools/daily-post.js --out post --day "${{ github.event.inputs.day }}"
          else
            node tools/daily-post.js --out post
          fi
          echo "----- 今日の投稿文 -----"
          cat post/body.md

      - name: Issueを立てる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="$(cat post/title.txt)"
          # 同じ日に2回動いても、Issueが2つにならないようにします
          if gh issue list --state open --search "$TITLE in:title" --json title \
               --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "同じ日のIssueがもうあります。何もしません。"
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file post/body.md
